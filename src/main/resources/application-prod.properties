# =============================================
# Production Profile Render + Supabase + Upstash
# Activate: SPRING_PROFILES_ACTIVE=prod
# =============================================

server.port=${PORT:8080}

# =============================================
# PostgreSQL Supabase Pooler (Transaction mode)
# MUST use pooler URL, NOT direct db.xxx.supabase.co
# Format: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
# =============================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP tuned for Supabase Pro + PgBouncer
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=60

# Jackson timezone — serialize all dates in Vietnam time
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# JPA CRITICAL: disable metadata access to prevent startup crash
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# CORS production domains
app.cors.allowed-origins=${CORS_ORIGINS:https://dodongkimanh.vercel.app}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Redis Upstash
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=5000ms
spring.data.redis.connect-timeout=5000ms

# Lettuce connection pool (auto-reconnect on Render cold start)
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-idle=3
spring.data.redis.lettuce.pool.max-active=5
spring.data.redis.lettuce.pool.max-wait=3000ms
spring.data.redis.lettuce.shutdown-timeout=200ms

# DB Heartbeat keep Supabase free tier alive
app.db.heartbeat-enabled=${DB_HEARTBEAT_ENABLED:true}

# Self-ping keep-alive (prevents Render free tier spin-down)
app.keep-alive.enabled=${KEEP_ALIVE_ENABLED:true}
app.keep-alive.url=${RENDER_EXTERNAL_URL:https://crm-be-jdvw.onrender.com}

# Logging minimal for prod
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO
